name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libsdl2-dev \
            libegl1-mesa-dev \
            ccache \
            patch \
            wget \
            curl \
            lld

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Setup Android SDK and NDK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r28c
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          
          # Create SDK directory structure
          mkdir -p $ANDROID_HOME/cmdline-tools
          mkdir -p $ANDROID_HOME/build-tools
          mkdir -p $ANDROID_HOME/platforms
          
          echo "Installing cmdline-tools..."
          
          # Download and setup cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install build-tools and platform using the correct sdkmanager
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          
          # Create tools symlink for compatibility with older tools
          if [ ! -d "$ANDROID_HOME/tools" ]; then
            ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          fi
          
          # Verify installation
          echo "SDK Structure:"
          ls -la $ANDROID_HOME/
          echo ""
          echo "Build-tools:"
          ls -la $ANDROID_HOME/build-tools/ || echo "No build-tools"
          echo ""
          echo "Checking aidl:"
          ls -la $ANDROID_HOME/build-tools/33.0.2/aidl || echo "aidl missing"
          echo ""
          echo "Checking tools/bin:"
          ls -la $ANDROID_HOME/tools/bin/ || echo "tools/bin missing"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Update buildozer.spec
        run: |
          # Update buildozer.spec with correct paths
          if [ -f "buildozer.spec" ]; then
            sed -i 's|^#android.sdk_path = .*|android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk|' buildozer.spec
            sed -i 's|^#android.ndk_path = .*|android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r28c|' buildozer.spec
            sed -i 's|^android.sdk_path = .*|android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk|' buildozer.spec
            sed -i 's|^android.ndk_path = .*|android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r28c|' buildozer.spec
          fi

      - name: Build debug APK
        run: |
          buildozer android debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}

      - name: List outputs
        run: |
          echo "Contents of bin:"
          ls -lah bin || echo "No bin directory"
          echo ""
          echo "APK files:"
          find bin -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-quest-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
